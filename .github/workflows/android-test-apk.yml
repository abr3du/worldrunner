name: Android test APK

# Builds the fake-data debug APK, runs the checks, and publishes it as a GitHub
# Release so it can be downloaded straight to a phone. The newest one is always at
# https://github.com/abr3du/worldrunner/releases/latest/download/worldrunner-test-debug.apk
#
# versionCode is the commit count of the built commit, so each newer main build
# updates the installed app. Every APK is signed with the same test key from the
# ANDROID_* secrets; a different key would make Android refuse the update.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-test-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-test-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/worldrunner-test.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: versionCode is `git rev-list --count HEAD`.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v5

      - name: Check signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"

      - name: Unit, repository, and Robolectric Compose tests
        working-directory: android
        run: ./gradlew --no-daemon :core:model:test testDebugUnitTest

      - name: Android lint
        working-directory: android
        run: ./gradlew --no-daemon lint

      - name: Assemble signed debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify signature and name the APK
        id: apk
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$tools/apksigner" verify --print-certs "$apk"
          code=$("$tools/aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          name=$("$tools/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          mkdir dist
          cp "$apk" dist/worldrunner-test-debug.apk
          (cd dist && sha256sum worldrunner-test-debug.apk > worldrunner-test-debug.apk.sha256)
          echo "tag=android-test-$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          # A release for this commit may already exist (for example one published
          # by hand after device testing). Never replace an APK someone may have installed.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not replacing it."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Worldrunner test build $NAME (debug, fake data)" \
            --notes "Debug test build with fake data; no backend needed. Install guide: https://github.com/${GITHUB_REPOSITORY}#install-the-test-app-on-android"

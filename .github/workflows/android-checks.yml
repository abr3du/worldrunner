name: Android checks

# Runs the same tests and lint as the release workflow on pull requests, without signing secrets, so changes are
# checked before they reach main. Map screenshots from StandingsMapScreenshotTest are uploaded for review.

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-checks.yml"
  workflow_dispatch:

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit, repository, and Robolectric Compose tests
        working-directory: android
        run: ./gradlew --no-daemon :core:model:test testDebugUnitTest

      - name: Android lint
        working-directory: android
        run: ./gradlew --no-daemon lint

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test reports and map screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-checks
          path: |
            android/**/build/reports/tests/
            android/**/build/reports/lint-results-*.html
            android/feature/standings/build/outputs/screenshots/
          if-no-files-found: ignore
